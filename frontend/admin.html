<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Absensi</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="brand"><div class="logo">5</div><div><b>ADMIN ABSENSI</b><small>SMA NEGERI 5 KEPULAUAN ARU</small></div></div><button class="ghost" onclick="location.href='index.html'">Absensi</button></header><main style="max-width:1100px;margin:30px auto;padding:0 20px"><div class="card" style="padding:22px"><h1>Data & Rekap</h1><p>Gunakan backend API untuk menambah siswa, menyimpan descriptor wajah, dan menampilkan rekap.</p><div class="stats"><div><b id="h">0</b><span>Hadir</span></div><div><b id="s">0</b><span>Sakit</span></div><div><b id="i">0</b><span>Izin</span></div><div><b id="a">0</b><span>Alpa</span></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" style="width:auto" onclick="load()">Muat Rekap Hari Ini</button><button class="ghost" onclick="exportExcel()">📊 Export Excel</button></div><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Jam</th><th>Status</th></tr></thead><tbody id="body"></tbody></table></div></div></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="js/config.js"></script><script>let latest=[];async function load(){const r=await fetch(APP_CONFIG.API_BASE_URL+'/attendance.php?action=today');const d=await r.json();h.textContent=d.counts.hadir;s.textContent=d.counts.sakit;i.textContent=d.counts.izin;a.textContent=d.counts.alpa;latest=d.rows;body.innerHTML=d.rows.map(x=>`<tr><td>${x.nama}</td><td>${x.kelas}</td><td>${x.jam}</td><td>${x.status}</td></tr>`).join('')}function exportExcel(){if(!latest.length){alert('Belum ada data rekap.');return}const data=latest.map((x,n)=>({No:n+1,NIS:'',Nama:x.nama,Kelas:x.kelas,Tanggal:new Date().toLocaleDateString('id-ID'),Jam:x.jam,Status:x.status}));const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Absensi');XLSX.writeFile(wb,'Rekap_Absensi_SMAN5_Kepulauan_Aru.xlsx')}load()</script></body></html>
