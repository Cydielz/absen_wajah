<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Absensi Wajah - SMA Negeri 5 Kepulauan Aru</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><div class="brand"><div class="logo">5</div><div><b>SMA NEGERI 5 KEPULAUAN ARU</b><small>ABSENSI WAJAH SISWA</small></div></div><button id="adminBtn" class="ghost">Admin</button></header>
<main><section class="hero"><div><span class="pill">MANGGUREBE MAJU</span><h1>Absensi Siswa<br>Berbasis Wajah</h1><p>Hadapkan wajah ke kamera. Sistem mengenali siswa dan mencatat kehadiran secara otomatis.</p></div><div class="card camera-card"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div id="status" class="status">Kamera belum aktif</div><button id="startBtn" class="primary">Mulai Kamera</button></div></section>
<section class="stats"><div><b id="hadir">0</b><span>Hadir</span></div><div><b id="sakit">0</b><span>Sakit</span></div><div><b id="izin">0</b><span>Izin</span></div><div><b id="alpa">0</b><span>Alpa</span></div></section>
<section class="card recent"><div class="section-head"><h2>Absensi Hari Ini</h2><button id="refreshBtn" class="ghost">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Jam</th><th>Status</th></tr></thead><tbody id="recentBody"></tbody></table></div></section></main>
<div id="adminModal" class="modal hidden"><div class="modal-box"><button class="close" id="closeModal">×</button><h2>Login Admin</h2><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button id="loginBtn" class="primary">Masuk</button><p id="loginMsg"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script><script src="js/config.js"></script><script src="js/app.js"></script></body></html>
